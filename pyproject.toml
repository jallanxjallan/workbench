[project]
name = "workbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=5.1", "Pillow>=10.0.0"]

[project.scripts]
wkb = "workbench.cli.main:entrypoint"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["workbench*"]
