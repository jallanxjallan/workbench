[project]
name = "workbench"
version = "0.1.0"
description = "Workbench runtime tooling and CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=5.1", "typer>=0.12.0"]

[project.scripts]
wkb = "cli.main:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]