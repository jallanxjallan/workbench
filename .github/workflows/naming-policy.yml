name: Naming Policy

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  naming-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run naming checks
        run: python3 scripts/check_naming_conventions.py
